name: sync release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate WebUI JavaScript
        run: |
          node --check static/app.js
          node --check static/native_capture_ui.js
          node --check static/defense.js

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('app/__init__.py').read_text(encoding='utf-8')
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text)
          if not m:
              raise SystemExit('Version not found')
          print(m.group(1))
          PY
          )
          if [[ "$VERSION" == beta* ]]; then
            TAG=$(echo "$VERSION" | tr ' ' '-')
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            TAG="v$VERSION"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          python - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          out = []
          active = False
          for line in lines:
              if line.startswith('## '):
                  if active:
                      break
                  if line.startswith(f'## {version}'):
                      active = True
                      continue
              if active:
                  out.append(line)
          notes = '\n'.join(out).strip()
          if not notes:
              notes = f'{version} release.'
          Path('release-notes.md').write_text(notes + '\n', encoding='utf-8')
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish beta tag and release
        if: steps.version.outputs.prerelease == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin -f "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" --title "$VERSION" --notes-file release-notes.md --prerelease --target "$GITHUB_SHA"
          fi

      - name: Publish stable tag and release
        if: steps.version.outputs.prerelease == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Stable release $TAG already exists; leaving its tag and release unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --title "$VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"
